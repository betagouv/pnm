name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Same rule as the Scalingo buildpack for engines.node ">=24": the Active LTS
          node-version: lts/*
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

      # The server does not start without its data: it reads them from the S3 folder, as in
      # production, and loads them before listening
      - name: Start the server as Scalingo does
        env:
          DATA_URL: ${{ vars.DATA_URL }}
        run: |
          npm start &
          for i in $(seq 1 60); do
            curl -fs http://localhost:3000/api/health && exit 0
            sleep 1
          done
          exit 1
